<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg4)"/>
  <!-- Section headers -->
  <text x="400" y="35" font-family="system-ui,sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">Real-World Applications of Linear Regression</text>
  <!-- Grid of application cards -->
  <!-- Real Estate -->
  <g transform="translate(40,60)">
    <rect width="220" height="90" rx="8" fill="#1e293b" stroke="#6366f130" stroke-width="1"/>
    <text x="15" y="28" font-size="22">🏠</text>
    <text x="45" y="30" font-family="system-ui,sans-serif" font-size="13" fill="#a5b4fc" font-weight="600">Real Estate</text>
    <text x="15" y="52" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Zillow's Zestimate: price prediction</text>
    <text x="15" y="68" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">for 100M+ homes using regression</text>
    <text x="15" y="82" font-family="system-ui,sans-serif" font-size="9" fill="#6366f1">ŷ = w₁·size + w₂·beds + w₃·loc + b</text>
  </g>
  <!-- Finance -->
  <g transform="translate(290,60)">
    <rect width="220" height="90" rx="8" fill="#1e293b" stroke="#a855f730" stroke-width="1"/>
    <text x="15" y="28" font-size="22">📈</text>
    <text x="45" y="30" font-family="system-ui,sans-serif" font-size="13" fill="#c084fc" font-weight="600">Finance</text>
    <text x="15" y="52" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Credit scoring &amp; risk assessment</text>
    <text x="15" y="68" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">1% accuracy = millions saved</text>
    <text x="15" y="82" font-family="system-ui,sans-serif" font-size="9" fill="#a855f7">P(default) = f(income, history, debt)</text>
  </g>
  <!-- Healthcare -->
  <g transform="translate(540,60)">
    <rect width="220" height="90" rx="8" fill="#1e293b" stroke="#10b98130" stroke-width="1"/>
    <text x="15" y="28" font-size="22">🏥</text>
    <text x="45" y="30" font-family="system-ui,sans-serif" font-size="13" fill="#34d399" font-weight="600">Healthcare</text>
    <text x="15" y="52" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Patient recovery prediction</text>
    <text x="15" y="68" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Drug dosage optimization</text>
    <text x="15" y="82" font-family="system-ui,sans-serif" font-size="9" fill="#10b981">recovery_days = f(age, BMI, procedure)</text>
  </g>
  <!-- Climate -->
  <g transform="translate(40,170)">
    <rect width="220" height="90" rx="8" fill="#1e293b" stroke="#06b6d430" stroke-width="1"/>
    <text x="15" y="28" font-size="22">🌤️</text>
    <text x="45" y="30" font-family="system-ui,sans-serif" font-size="13" fill="#67e8f9" font-weight="600">Climate Science</text>
    <text x="15" y="52" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">The "hockey stick" temperature graph</text>
    <text x="15" y="68" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">1000 years of proxy data analysis</text>
    <!-- Mini hockey stick -->
    <path d="M 15,85 L 140,83 Q 160,80 180,65" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  </g>
  <!-- Manufacturing -->
  <g transform="translate(290,170)">
    <rect width="220" height="90" rx="8" fill="#1e293b" stroke="#f59e0b30" stroke-width="1"/>
    <text x="15" y="28" font-size="22">🏭</text>
    <text x="45" y="30" font-family="system-ui,sans-serif" font-size="13" fill="#fbbf24" font-weight="600">Manufacturing</text>
    <text x="15" y="52" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Predictive maintenance at Toyota</text>
    <text x="15" y="68" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Replace before failure, save millions</text>
    <text x="15" y="82" font-family="system-ui,sans-serif" font-size="9" fill="#f59e0b">failure_time = f(vibration, temp, usage)</text>
  </g>
  <!-- Insurance -->
  <g transform="translate(540,170)">
    <rect width="220" height="90" rx="8" fill="#1e293b" stroke="#ec489930" stroke-width="1"/>
    <text x="15" y="28" font-size="22">🚗</text>
    <text x="45" y="30" font-family="system-ui,sans-serif" font-size="13" fill="#f472b6" font-weight="600">Insurance</text>
    <text x="15" y="52" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Your premium IS a regression prediction</text>
    <text x="15" y="68" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Age, record, car model → annual cost</text>
    <text x="15" y="82" font-family="system-ui,sans-serif" font-size="9" fill="#ec4899">premium = f(age, accidents, car, zip)</text>
  </g>
  <!-- Bottom: interpretability callout -->
  <g transform="translate(100,290)">
    <rect width="600" height="80" rx="10" fill="#1e293b" stroke="#6366f140" stroke-width="1"/>
    <text x="20" y="28" font-size="18">💡</text>
    <text x="50" y="30" font-family="system-ui,sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">Why Regression? Interpretability.</text>
    <text x="50" y="52" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">"Each m² adds $2,000, each bedroom adds $15,000, baseline is $300,000"</text>
    <text x="50" y="70" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Doctors, judges, and regulators demand this kind of explainability.</text>
  </g>
</svg>