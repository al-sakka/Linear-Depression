<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg6)"/>
  <text x="400" y="35" font-family="system-ui,sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">Matrix Formulation: Ŷ = XW + b</text>
  <!-- X matrix -->
  <g transform="translate(50,70)">
    <text x="60" y="0" font-family="system-ui,sans-serif" font-size="13" fill="#a5b4fc" font-weight="600" text-anchor="middle">X (m × n)</text>
    <!-- Bracket -->
    <path d="M 5,15 L 0,15 L 0,170 L 5,170" fill="none" stroke="#6366f1" stroke-width="2"/>
    <path d="M 115,15 L 120,15 L 120,170 L 115,170" fill="none" stroke="#6366f1" stroke-width="2"/>
    <!-- Matrix content -->
    <text x="20" y="45" font-family="monospace" font-size="11" fill="#e2e8f0">80  3  10</text>
    <text x="20" y="70" font-family="monospace" font-size="11" fill="#e2e8f0">120 4   5</text>
    <text x="20" y="95" font-family="monospace" font-size="11" fill="#e2e8f0">65  2  15</text>
    <text x="20" y="120" font-family="monospace" font-size="11" fill="#94a3b8">...  ... ...</text>
    <text x="20" y="145" font-family="monospace" font-size="11" fill="#e2e8f0">200 5   3</text>
    <text x="20" y="160" font-family="monospace" font-size="11" fill="#e2e8f0"> </text>
    <!-- Labels -->
    <text x="25" y="190" font-family="system-ui,sans-serif" font-size="9" fill="#6366f1">size</text>
    <text x="55" y="190" font-family="system-ui,sans-serif" font-size="9" fill="#6366f1">beds</text>
    <text x="85" y="190" font-family="system-ui,sans-serif" font-size="9" fill="#6366f1">age</text>
    <text x="60" y="208" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">m samples × n features</text>
  </g>
  <!-- Multiplication sign -->
  <text x="200" y="165" font-family="system-ui,sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">×</text>
  <!-- W vector -->
  <g transform="translate(230,70)">
    <text x="30" y="0" font-family="system-ui,sans-serif" font-size="13" fill="#c084fc" font-weight="600" text-anchor="middle">W</text>
    <path d="M 5,15 L 0,15 L 0,120 L 5,120" fill="none" stroke="#a855f7" stroke-width="2"/>
    <path d="M 55,15 L 60,15 L 60,120 L 55,120" fill="none" stroke="#a855f7" stroke-width="2"/>
    <text x="15" y="45" font-family="monospace" font-size="11" fill="#c084fc">5000</text>
    <text x="10" y="70" font-family="monospace" font-size="11" fill="#c084fc">20000</text>
    <text x="10" y="95" font-family="monospace" font-size="11" fill="#c084fc">-3000</text>
    <text x="10" y="145" font-family="system-ui,sans-serif" font-size="9" fill="#a855f7">w_size</text>
    <text x="10" y="160" font-family="system-ui,sans-serif" font-size="9" fill="#a855f7">w_beds</text>
    <text x="10" y="175" font-family="system-ui,sans-serif" font-size="9" fill="#a855f7">w_age</text>
  </g>
  <!-- Plus sign -->
  <text x="320" y="125" font-family="system-ui,sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">+</text>
  <!-- b scalar -->
  <g transform="translate(340,90)">
    <text x="20" y="0" font-family="system-ui,sans-serif" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">b</text>
    <rect x="0" y="10" width="40" height="30" rx="4" fill="#1e293b" stroke="#f59e0b50" stroke-width="1"/>
    <text x="20" y="32" font-family="monospace" font-size="11" fill="#fbbf24" text-anchor="middle">100K</text>
  </g>
  <!-- Equals -->
  <text x="405" y="125" font-family="system-ui,sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">=</text>
  <!-- Result Ŷ -->
  <g transform="translate(430,70)">
    <text x="30" y="0" font-family="system-ui,sans-serif" font-size="13" fill="#34d399" font-weight="600" text-anchor="middle">Ŷ</text>
    <path d="M 5,15 L 0,15 L 0,170 L 5,170" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 55,15 L 60,15 L 60,170 L 55,170" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="12" y="45" font-family="monospace" font-size="11" fill="#34d399">530K</text>
    <text x="12" y="70" font-family="monospace" font-size="11" fill="#34d399">765K</text>
    <text x="12" y="95" font-family="monospace" font-size="11" fill="#34d399">425K</text>
    <text x="20" y="120" font-family="monospace" font-size="11" fill="#94a3b8">...</text>
    <text x="12" y="145" font-family="monospace" font-size="11" fill="#34d399">1.19M</text>
  </g>
  <!-- Normal equation -->
  <g transform="translate(100,300)">
    <rect width="600" height="70" rx="10" fill="#1e293b" stroke="#6366f130" stroke-width="1"/>
    <text x="300" y="28" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">The Normal Equation — optimal weights in one step:</text>
    <text x="300" y="55" font-family="serif" font-size="20" fill="#a5b4fc" text-anchor="middle" font-style="italic" filter="url(#glow6)">W* = (X⁹X)⁻¹X⁹y</text>
  </g>
  <!-- GPU note -->
  <g transform="translate(530,70)">
    <rect width="220" height="100" rx="8" fill="#0f172a" stroke="#10b98130" stroke-width="1"/>
    <text x="15" y="25" font-family="system-ui,sans-serif" font-size="11" fill="#34d399" font-weight="600">⚡ GPU Parallelism</text>
    <text x="15" y="48" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">One matrix multiply replaces</text>
    <text x="15" y="63" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">m individual equations.</text>
    <text x="15" y="85" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">O(n³) for normal equation</text>
    <text x="15" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">O(mn) per gradient step</text>
  </g>
</svg>