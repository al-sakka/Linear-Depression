<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow8">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg8)"/>
  <text x="400" y="35" font-family="system-ui,sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">Correlation ≠ Causation</text>
  <!-- Ice cream example -->
  <g transform="translate(40,55)">
    <rect width="340" height="150" rx="10" fill="#1e293b" stroke="#ef444430" stroke-width="1"/>
    <text x="25" y="30" font-size="28">🍦</text>
    <text x="65" y="33" font-family="system-ui,sans-serif" font-size="13" fill="#f87171" font-weight="600">Ice Cream vs Drowning</text>
    <text x="170" y="55" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">r ≈ 0.85</text>
    <!-- Arrows showing confound -->
    <text x="170" y="85" font-size="24" text-anchor="middle">☀️</text>
    <text x="170" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Hot Weather</text>
    <text x="170" y="115" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(confounding variable)</text>
    <!-- Arrows from sun to both -->
    <line x1="130" y1="90" x2="60" y2="130" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr8)"/>
    <line x1="210" y1="90" x2="280" y2="130" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr8)"/>
    <text x="50" y="145" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">🍦 Ice cream</text>
    <text x="240" y="145" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">🏊 Swimming</text>
    <!-- False causation cross -->
    <line x1="100" y1="138" x2="230" y2="138" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="165" y="135" font-family="system-ui,sans-serif" font-size="14" fill="#ef4444" text-anchor="middle">✗</text>
  </g>
  <defs>
    <marker id="arr8" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#f59e0b"/>
    </marker>
    <marker id="arr8g" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#10b981"/>
    </marker>
  </defs>
  <!-- Chocolate Nobel example -->
  <g transform="translate(420,55)">
    <rect width="340" height="150" rx="10" fill="#1e293b" stroke="#a855f730" stroke-width="1"/>
    <text x="25" y="30" font-size="28">🍫</text>
    <text x="65" y="33" font-family="system-ui,sans-serif" font-size="13" fill="#c084fc" font-weight="600">Chocolate vs Nobel Prizes</text>
    <text x="170" y="55" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">r ≈ 0.79</text>
    <text x="170" y="85" font-size="24" text-anchor="middle">💰</text>
    <text x="170" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">GDP / Wealth</text>
    <text x="170" y="115" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(confounding variable)</text>
    <line x1="130" y1="90" x2="60" y2="130" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr8)"/>
    <line x1="210" y1="90" x2="280" y2="130" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr8)"/>
    <text x="40" y="145" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">🍫 Chocolate</text>
    <text x="250" y="145" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">🏆 Nobels</text>
    <line x1="100" y1="138" x2="230" y2="138" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="165" y="135" font-family="system-ui,sans-serif" font-size="14" fill="#ef4444" text-anchor="middle">✗</text>
  </g>
  <!-- Three types of relationships -->
  <g transform="translate(40,230)">
    <!-- Direct causation -->
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#1e293b" stroke="#10b98130" stroke-width="1"/>
    <text x="110" y="22" font-family="system-ui,sans-serif" font-size="11" fill="#34d399" font-weight="600" text-anchor="middle">✓ Direct Causation</text>
    <text x="40" y="48" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">🚬</text>
    <line x1="60" y1="45" x2="130" y2="45" stroke="#10b981" stroke-width="2" marker-end="url(#arr8g)"/>
    <text x="170" y="48" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">🫁</text>
    <text x="110" y="70" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Proven via controlled experiments</text>
    <!-- Reverse causation -->
    <rect x="250" y="0" width="240" height="80" rx="8" fill="#1e293b" stroke="#f59e0b30" stroke-width="1"/>
    <text x="370" y="22" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600" text-anchor="middle">⟷ Reverse Causation</text>
    <text x="310" y="48" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Crime</text>
    <line x1="340" y1="42" x2="390" y2="42" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="390" y1="48" x2="340" y2="48" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="365" y="38" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">?</text>
    <text x="430" y="48" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Poverty</text>
    <text x="370" y="70" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Which causes which?</text>
    <!-- Confounding -->
    <rect x="520" y="0" width="240" height="80" rx="8" fill="#1e293b" stroke="#ef444430" stroke-width="1"/>
    <text x="640" y="22" font-family="system-ui,sans-serif" font-size="11" fill="#f87171" font-weight="600" text-anchor="middle">⚠ Confounding</text>
    <text x="640" y="45" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Hidden variable C causes both A and B</text>
    <text x="640" y="65" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Most common trap in data science</text>
  </g>
  <!-- Bottom message -->
  <g transform="translate(140,330)">
    <rect width="520" height="50" rx="8" fill="#0f172a" stroke="#6366f130" stroke-width="1"/>
    <text x="260" y="22" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">ML models find correlations — only experiments establish causation.</text>
    <text x="260" y="40" font-family="system-ui,sans-serif" font-size="11" fill="#6366f1" text-anchor="middle" font-style="italic">A model is a tool — you are the thinker.</text>
  </g>
</svg>