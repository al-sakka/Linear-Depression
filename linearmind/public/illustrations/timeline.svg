<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg3)"/>
  <!-- Vertical timeline -->
  <line x1="100" y1="30" x2="100" y2="370" stroke="#334155" stroke-width="2"/>
  <!-- Milestones left side -->
  <circle cx="100" cy="50" r="5" fill="#6366f1" filter="url(#glow3)"/>
  <text x="120" y="48" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600">1795</text>
  <text x="120" y="62" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Gauss develops least squares (age 18)</text>

  <circle cx="100" cy="90" r="5" fill="#6366f1" filter="url(#glow3)"/>
  <text x="120" y="88" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600">1801</text>
  <text x="120" y="102" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Gauss predicts Ceres orbit</text>

  <circle cx="100" cy="130" r="4" fill="#a855f7" filter="url(#glow3)"/>
  <text x="120" y="128" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600">1805</text>
  <text x="120" y="142" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Legendre publishes method of least squares</text>

  <circle cx="100" cy="170" r="4" fill="#a855f7" filter="url(#glow3)"/>
  <text x="120" y="168" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600">1885</text>
  <text x="120" y="182" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Galton coins "regression to the mean"</text>

  <circle cx="100" cy="210" r="4" fill="#06b6d4" filter="url(#glow3)"/>
  <text x="120" y="208" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600">1896</text>
  <text x="120" y="222" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Pearson formalizes correlation coefficient</text>

  <circle cx="100" cy="250" r="4" fill="#f59e0b" filter="url(#glow3)"/>
  <text x="120" y="248" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600">1943</text>
  <text x="120" y="262" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">McCulloch &amp; Pitts: first neuron model</text>

  <circle cx="100" cy="290" r="4" fill="#10b981" filter="url(#glow3)"/>
  <text x="120" y="288" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600">1986</text>
  <text x="120" y="302" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Hinton popularizes backpropagation</text>

  <circle cx="100" cy="330" r="5" fill="#ec4899" filter="url(#glow3)"/>
  <text x="120" y="328" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600">2012</text>
  <text x="120" y="342" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">AlexNet ignites the deep learning revolution</text>

  <circle cx="100" cy="365" r="6" fill="#d97706" filter="url(#glow3)"/>
  <text x="120" y="363" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600">2024</text>
  <text x="120" y="377" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">LLMs with trillions of parameters — still y = wx + b</text>

  <!-- Right side: growth curve -->
  <g transform="translate(520,40)">
    <text x="100" y="0" font-family="system-ui,sans-serif" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">Scale of Computation</text>
    <!-- Axes -->
    <line x1="0" y1="20" x2="0" y2="300" stroke="#475569" stroke-width="1"/>
    <line x1="0" y1="300" x2="200" y2="300" stroke="#475569" stroke-width="1"/>
    <!-- Exponential growth curve -->
    <path d="M 10,290 Q 40,288 70,280 Q 100,270 120,240 Q 140,200 155,140 Q 170,70 185,30" fill="none" stroke="#6366f1" stroke-width="2.5" filter="url(#glow3)"/>
    <!-- Data points on curve -->
    <circle cx="10" cy="290" r="3" fill="#6366f1"/>
    <circle cx="40" cy="287" r="3" fill="#a855f7"/>
    <circle cx="70" cy="280" r="3" fill="#06b6d4"/>
    <circle cx="120" cy="240" r="3" fill="#f59e0b"/>
    <circle cx="155" cy="140" r="3" fill="#10b981"/>
    <circle cx="175" cy="60" r="4" fill="#ec4899"/>
    <circle cx="185" cy="30" r="5" fill="#d97706" filter="url(#glow3)"/>
    <!-- Y axis labels -->
    <text x="-5" y="295" font-family="system-ui,sans-serif" font-size="8" fill="#64748b" text-anchor="end">2</text>
    <text x="-5" y="245" font-family="system-ui,sans-serif" font-size="8" fill="#64748b" text-anchor="end">10³</text>
    <text x="-5" y="145" font-family="system-ui,sans-serif" font-size="8" fill="#64748b" text-anchor="end">10⁹</text>
    <text x="-5" y="35" font-family="system-ui,sans-serif" font-size="8" fill="#64748b" text-anchor="end">10¹²</text>
    <text x="-10" y="160" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="end" transform="rotate(-90,-10,160)">Parameters</text>
    <text x="100" y="320" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Year</text>
  </g>
</svg>