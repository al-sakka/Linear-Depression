<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow9">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg9)"/>
  <text x="400" y="35" font-family="system-ui,sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">Train / Test Split: Honest Evaluation</text>
  <!-- Full dataset bar -->
  <g transform="translate(80,60)">
    <text x="320" y="15" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Full Dataset (100%)</text>
    <rect width="640" height="30" rx="6" fill="#334155"/>
    <!-- Train portion -->
    <rect width="480" height="30" rx="6" fill="#6366f1" opacity="0.4"/>
    <text x="240" y="21" font-family="system-ui,sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">Training Set (75%)</text>
    <!-- Test portion -->
    <rect x="480" width="160" height="30" rx="6" fill="#10b981" opacity="0.4"/>
    <text x="560" y="21" font-family="system-ui,sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="600">Test (25%)</text>
  </g>
  <!-- Diagnosis grid -->
  <g transform="translate(60,120)">
    <text x="340" y="15" font-family="system-ui,sans-serif" font-size="13" fill="#a5b4fc" font-weight="600" text-anchor="middle">Diagnosis Guide</text>
    <!-- Headers -->
    <text x="200" y="45" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Train Error</text>
    <text x="340" y="45" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Test Error</text>
    <text x="500" y="45" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Diagnosis</text>
    <line x1="40" y1="55" x2="640" y2="55" stroke="#334155" stroke-width="1"/>
    <!-- Row 1: Underfitting -->
    <rect x="40" y="62" width="600" height="38" rx="4" fill="#ef444408"/>
    <text x="200" y="85" font-family="system-ui,sans-serif" font-size="12" fill="#f87171" text-anchor="middle" font-weight="600">HIGH ↑</text>
    <text x="340" y="85" font-family="system-ui,sans-serif" font-size="12" fill="#f87171" text-anchor="middle" font-weight="600">HIGH ↑</text>
    <text x="500" y="80" font-family="system-ui,sans-serif" font-size="12" fill="#f87171" text-anchor="middle" font-weight="600">📖 Underfitting</text>
    <text x="500" y="95" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Model too simple</text>
    <!-- Row 2: Overfitting -->
    <rect x="40" y="105" width="600" height="38" rx="4" fill="#f59e0b08"/>
    <text x="200" y="128" font-family="system-ui,sans-serif" font-size="12" fill="#34d399" text-anchor="middle" font-weight="600">LOW ↓</text>
    <text x="340" y="128" font-family="system-ui,sans-serif" font-size="12" fill="#f87171" text-anchor="middle" font-weight="600">HIGH ↑</text>
    <text x="500" y="123" font-family="system-ui,sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle" font-weight="600">🤓 Overfitting</text>
    <text x="500" y="138" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Model memorized data</text>
    <!-- Row 3: Good fit -->
    <rect x="40" y="148" width="600" height="38" rx="4" fill="#10b98108"/>
    <text x="200" y="171" font-family="system-ui,sans-serif" font-size="12" fill="#34d399" text-anchor="middle" font-weight="600">LOW ↓</text>
    <text x="340" y="171" font-family="system-ui,sans-serif" font-size="12" fill="#34d399" text-anchor="middle" font-weight="600">LOW ↓</text>
    <text x="500" y="166" font-family="system-ui,sans-serif" font-size="12" fill="#10b981" text-anchor="middle" font-weight="600">✅ Good Fit! 🎉</text>
    <text x="500" y="181" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Model generalizes well</text>
  </g>
  <!-- K-Fold visualization at bottom -->
  <g transform="translate(60,310)">
    <text x="340" y="15" font-family="system-ui,sans-serif" font-size="12" fill="#c084fc" font-weight="600" text-anchor="middle">K-Fold Cross Validation (K=5)</text>
    <!-- 5 rows of folds -->
    <g transform="translate(100,25)">
      <!-- Fold 1 -->
      <rect x="0" y="0" width="96" height="12" rx="2" fill="#10b981" opacity="0.5"/>
      <rect x="96" y="0" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="192" y="0" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="288" y="0" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="384" y="0" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <!-- Fold 2 -->
      <rect x="0" y="15" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="96" y="15" width="96" height="12" rx="2" fill="#10b981" opacity="0.5"/>
      <rect x="192" y="15" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="288" y="15" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="384" y="15" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <!-- Fold 3 -->
      <rect x="0" y="30" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="96" y="30" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="192" y="30" width="96" height="12" rx="2" fill="#10b981" opacity="0.5"/>
      <rect x="288" y="30" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="384" y="30" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <!-- Fold 4 -->
      <rect x="0" y="45" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="96" y="45" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="192" y="45" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
      <rect x="288" y="45" width="96" height="12" rx="2" fill="#10b981" opacity="0.5"/>
      <rect x="384" y="45" width="96" height="12" rx="2" fill="#6366f1" opacity="0.3"/>
    </g>
    <!-- Legend -->
    <rect x="590" y="30" width="12" height="12" rx="2" fill="#6366f1" opacity="0.4"/>
    <text x="608" y="40" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8">Train</text>
    <rect x="590" y="48" width="12" height="12" rx="2" fill="#10b981" opacity="0.6"/>
    <text x="608" y="58" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8">Test</text>
  </g>
</svg>