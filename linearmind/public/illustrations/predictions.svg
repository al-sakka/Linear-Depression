<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg5)"/>
  <text x="400" y="35" font-family="system-ui,sans-serif" font-size="16" fill="#e2e8f0" font-weight="600" text-anchor="middle">Making Predictions: ŷ = wx + b</text>
  <!-- Coordinate system -->
  <g transform="translate(80,60)">
    <!-- Axes -->
    <line x1="0" y1="280" x2="300" y2="280" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="280" x2="0" y2="20" stroke="#475569" stroke-width="1.5"/>
    <text x="150" y="310" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Size (m²)</text>
    <text x="-15" y="150" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" transform="rotate(-90,-15,150)">Price (EGP)</text>
    <!-- Axis tick marks -->
    <line x1="60" y1="280" x2="60" y2="285" stroke="#475569"/>
    <text x="60" y="298" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">50</text>
    <line x1="120" y1="280" x2="120" y2="285" stroke="#475569"/>
    <text x="120" y="298" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">100</text>
    <line x1="180" y1="280" x2="180" y2="285" stroke="#475569"/>
    <text x="180" y="298" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">150</text>
    <line x1="240" y1="280" x2="240" y2="285" stroke="#475569"/>
    <text x="240" y="298" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">200</text>
    <!-- Y ticks -->
    <text x="-5" y="240" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="end">200K</text>
    <text x="-5" y="180" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="end">400K</text>
    <text x="-5" y="120" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="end">600K</text>
    <text x="-5" y="60" font-family="system-ui,sans-serif" font-size="9" fill="#64748b" text-anchor="end">800K</text>
    <!-- Regression line -->
    <line x1="0" y1="250" x2="280" y2="50" stroke="#6366f1" stroke-width="2.5" filter="url(#glow5)"/>
    <!-- Data points -->
    <circle cx="40" cy="235" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="70" cy="210" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="90" cy="200" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="110" cy="185" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="130" cy="160" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="160" cy="150" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="190" cy="115" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="220" cy="90" r="4" fill="#a855f7" opacity="0.7"/>
    <circle cx="250" cy="70" r="4" fill="#a855f7" opacity="0.7"/>
    <!-- Prediction highlight: x=120 -->
    <line x1="144" y1="280" x2="144" y2="130" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="0" y1="130" x2="144" y2="130" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="144" cy="130" r="6" fill="#10b981" filter="url(#glow5)"/>
    <text x="148" y="125" font-family="system-ui,sans-serif" font-size="10" fill="#10b981">(120, 700K)</text>
  </g>
  <!-- Right side: calculation breakdown -->
  <g transform="translate(440,80)">
    <rect width="320" height="250" rx="12" fill="#1e293b" stroke="#6366f130" stroke-width="1"/>
    <text x="160" y="35" font-family="system-ui,sans-serif" font-size="14" fill="#e2e8f0" font-weight="600" text-anchor="middle">Prediction Calculation</text>
    <!-- Step by step -->
    <text x="25" y="70" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Given:</text>
    <text x="25" y="92" font-family="monospace" font-size="13" fill="#a5b4fc">w = 5,000 EGP/m²</text>
    <text x="25" y="112" font-family="monospace" font-size="13" fill="#a5b4fc">b = 100,000 EGP</text>
    <text x="25" y="132" font-family="monospace" font-size="13" fill="#fbbf24">x = 120 m²</text>
    <line x1="25" y1="145" x2="295" y2="145" stroke="#334155" stroke-width="1"/>
    <text x="25" y="170" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Calculate:</text>
    <text x="25" y="195" font-family="monospace" font-size="13" fill="#e2e8f0">ŷ = w × x + b</text>
    <text x="25" y="215" font-family="monospace" font-size="13" fill="#e2e8f0">ŷ = 5,000 × 120 + 100,000</text>
    <text x="25" y="240" font-family="monospace" font-size="15" fill="#10b981" font-weight="700" filter="url(#glow5)">ŷ = 700,000 EGP ✓</text>
  </g>
</svg>